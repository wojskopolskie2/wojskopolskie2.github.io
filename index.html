<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wojsko Polskie 2.0 - Serwer Minecraft</title>
  <style>
    /* --- ZMIENNE KOLORÓW (MOTYWY) --- */
    :root {
      --bg-color: #f4f6f8;
      --text-color: #1a1a1a;
      --nav-bg: #ffffff;
      --card-bg: #ffffff;
      --footer-bg: #e2e8f0;
      --border-color: #cbd5e1;
      --accent-color: #2e7d32;
      --accent-hover: #1b5e20;
      --discord-color: #5865F2;
      --discord-hover: #4752C4;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
      --badge-bg: #e8f5e9;
      --badge-color: #2e7d32;
    }

    [data-theme="dark"] {
      --bg-color: #0f172a;
      --text-color: #f1f5f9;
      --nav-bg: #1e293b;
      --card-bg: #1e293b;
      --footer-bg: #0f172a;
      --border-color: #334155;
      --accent-color: #4caf50;
      --accent-hover: #388e3c;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
      --badge-bg: #1b3820;
      --badge-color: #81c784;
    }

    /* --- RESET I STYLE PODSTAWOWE --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* --- PASEK GÓRNY (NAVBAR) --- */
    header {
      background-color: var(--nav-bg);
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 2rem;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    .nav-logo {
      display: flex;
      align-items: center;
    }

    .nav-logo img {
      height: 48px;
      width: auto;
      object-fit: contain;
      cursor: pointer;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }

    .nav-link {
      text-decoration: none;
      color: var(--text-color);
      font-weight: 600;
      font-size: 1rem;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--accent-color);
      background-color: var(--bg-color);
    }

    .nav-actions {
      display: flex;
      justify-content: flex-end;
    }

    .theme-toggle-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .theme-toggle-btn:hover {
      background-color: var(--border-color);
    }

    /* --- TREŚĆ GŁÓWNA --- */
    main {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 3rem auto;
      padding: 0 1.5rem;
    }

    .page-section {
      display: none;
    }

    .page-section.active {
      display: block;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: var(--shadow);
    }

    .hero-card {
      text-align: center;
    }

    .badge {
      display: inline-block;
      background-color: var(--badge-bg);
      color: var(--badge-color);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 0.4rem 1rem;
      border-radius: 50px;
      margin-bottom: 1rem;
      text-transform: uppercase;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 1rem;
    }

    h2 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: var(--accent-color);
    }

    .hero-description {
      font-size: 1.1rem;
      line-height: 1.6;
      max-width: 700px;
      margin: 0 auto 2rem auto;
      opacity: 0.9;
    }

    /* BANER IP */
    .ip-box {
      display: inline-flex;
      align-items: center;
      gap: 1rem;
      background-color: var(--bg-color);
      border: 2px dashed var(--accent-color);
      padding: 0.8rem 1.5rem;
      border-radius: 10px;
      cursor: pointer;
    }

    .ip-text {
      font-family: monospace;
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    .btn {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn-discord {
      background-color: var(--discord-color);
    }

    .btn-discord:hover {
      background-color: var(--discord-hover);
    }

    /* REGULAMIN */
    .rules-list {
      list-style: none;
      counter-reset: rule-counter;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .rules-list li {
      counter-increment: rule-counter;
      position: relative;
      padding-left: 3rem;
      line-height: 1.6;
    }

    .rules-list li::before {
      content: counter(rule-counter);
      position: absolute;
      left: 0;
      top: 0;
      background-color: var(--accent-color);
      color: white;
      font-weight: bold;
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
    }

    /* KONTAKT */
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-top: 1.5rem;
    }

    .contact-item {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
